name: ci
run-name: "Regression Test"


on:
  schedule:
    - cron: '30 1 * * *'

  push:
    branches: ["main"]
    paths-ignore:
      - '**/README.md'
      - '**/*.png'
      - 'rabbitmq_spec/**'
      - 'prepare_release.sh'
      - 'regression_test.sh'

  workflow_dispatch:
    
  pull_request:
    branches: ["main"]
    paths-ignore:
      - '**/README.md'
      - '**/*.png'
      - 'rabbitmq_spec/**'
      - 'prepare_release.sh'
      - 'regression_test.sh'

env:
  CARGO_TERM_COLOR: always

jobs:
  builds:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check rust version
        run: rustc -V; cargo -V; rustup -V

      - name: cargo build (debug, all-features)
        run: cargo build --all-features --verbose

      - name: cargo clippy (all-features)
        run: cargo clippy --all-features -- -Dwarnings

  check_msrv:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - '1.71'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: cargo check (published crates, all-features)
        run: cargo check -p amqprs -p amqp_serde --all-features --locked

  test_examples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start RabbitMQ server
        run: ./start_rabbitmq.sh

      - name: examples
        run: ./examples/run_examples.sh

  test_features_combination:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        feat:
          - -F default
          - -F traces
          - -F compliance_assert
          - -F tls
          - -F urispec
          - --all-features --release
    steps:
      - name: Check rust version
        run: rustc -V; cargo -V; rustup -V

      - uses: actions/checkout@v4
      - name: Start RabbitMQ server
        run: ./start_rabbitmq.sh

      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: ${{ matrix.feat }}

  fire_routine_on_failure:
    needs: [builds, check_msrv, test_examples, test_features_combination]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: POST to Claude Code routine /fire
        env:
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          jq -n \
            --arg t "Daily Regression Test workflow failed.
          repository: ${{ github.repository }}
          run_id: $RUN_ID
          url:    $RUN_URL
          sha:    $HEAD_SHA" \
            '{text: $t}' > body.json

          curl -fsS -X POST "$CLAUDE_ROUTINE_URL" \
            -H "Authorization: Bearer $CLAUDE_ROUTINE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data @body.json